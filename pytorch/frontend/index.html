<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Drowsiness Detection System</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            padding: 20px;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 2rem; margin-bottom: 5px; }
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .video-container { background: #000; border-radius: 15px; overflow: hidden; }
        #video-feed { width: 100%; height: auto; }
        .status-panel { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; }
        .status-card { margin-bottom: 15px; }
        .status-value { font-size: 1.5rem; font-weight: bold; }
        .alert-status { text-align: center; padding: 15px; border-radius: 10px; margin-top: 20px; }
        .alert-normal { border-left: 5px solid #10b981; }
        .alert-danger { border-left: 5px solid #ef4444; animation: blink 1s infinite; }
        .status-indicator { width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .indicator-safe { background: #10b981; }
        .indicator-danger { background: #ef4444; }
        @keyframes blink { 0%,50%,100% {opacity:1;} 25%,75% {opacity:0.5;} }
    </style>
</head>
<body>
    <header>
        <h1>🚗 Driver Drowsiness Detection System</h1>
        <p>AI-Powered Real-Time Monitoring</p>
    </header>

    <div class="main-grid">
        <div class="video-container">
            <img id="video-feed" src="/video" alt="Video Feed">
        </div>

        <div class="status-panel">
            <div class="status-card">
                <h3>Driver Status</h3>
                <div class="status-value" id="driver-status">Alert</div>
            </div>

            <div class="status-card">
                <h3>Eye Aspect Ratio</h3>
                <div class="status-value" id="ear-value">0.25</div>
            </div>

            <div class="alert-status alert-normal" id="alert-panel">
                <div class="status-indicator indicator-safe" id="status-indicator">✓</div>
                <p id="alert-message">All Systems Normal</p>
            </div>

            <div class="status-card">
                <h3>Detections</h3>
                <div class="status-value" id="detection-count">0</div>
            </div>

            <div class="status-card">
                <h3>Alerts Triggered</h3>
                <div class="status-value" id="alert-count">0</div>
            </div>

            <div class="status-card">
                <h3>Session Duration</h3>
                <div class="status-value" id="session-time">00:00</div>
            </div>
        </div>
    </div>

    <script>
        let sessionStart = Date.now();

        function updateSessionTime() {
            const elapsed = Math.floor((Date.now() - sessionStart)/1000);
            const minutes = Math.floor(elapsed/60);
            const seconds = elapsed % 60;
            document.getElementById('session-time').textContent = 
                `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
        }

        async function fetchStatus() {
            const response = await fetch('/status');
            const data = await response.json();

            document.getElementById('driver-status').textContent = data.driver_state;
            document.getElementById('ear-value').textContent = data.ear_value.toFixed(2);
            document.getElementById('detection-count').textContent = data.detection_count;
            document.getElementById('alert-count').textContent = data.alert_count;

            const alertPanel = document.getElementById('alert-panel');
            const statusIndicator = document.getElementById('status-indicator');

            if(data.alert){
                alertPanel.className = 'alert-status alert-danger';
                statusIndicator.className = 'status-indicator indicator-danger';
                statusIndicator.textContent = '!';
                document.getElementById('alert-message').textContent = 'DROWSINESS DETECTED!';
            } else {
                alertPanel.className = 'alert-status alert-normal';
                statusIndicator.className = 'status-indicator indicator-safe';
                statusIndicator.textContent = '✓';
                document.getElementById('alert-message').textContent = 'All Systems Normal';
            }
        }

        setInterval(updateSessionTime, 1000);
        setInterval(fetchStatus, 500); // Poll every 0.5 sec
    </script>
</body>
</html>
